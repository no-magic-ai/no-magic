name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "Verification mode"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - full

permissions:
  contents: read

jobs:
  # ── Fast gates: every push/PR, at the exact pushed or PR head commit ──
  # scripts/verify.py is the single discovery authority for every job below.
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax, seed and import checks for every tier script
        run: python scripts/verify.py --quick

  behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Numerical property checks against the teaching source
        run: python scripts/verify.py --behavior

  # ── Program selection: changed scripts on PRs, every script in manual full mode ──
  select:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
    runs-on: ubuntu-latest
    outputs:
      programs: ${{ steps.select.outputs.programs }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select programs
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            programs=$(python scripts/verify.py --list-json --changed-from "$BASE_SHA")
          else
            programs=$(python scripts/verify.py --list-json)
          fi
          count=$(python -c 'import json, sys; print(len(json.loads(sys.argv[1])))' "$programs")
          echo "Selected $count program(s): $programs"
          if [ "$count" = "0" ]; then
            echo "::notice::No runnable tier script changed; no program was executed (not a runtime pass)."
          fi
          echo "programs=$programs" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

  # ── Execution: one bounded job per selected program, default settings ──
  # verify.py enforces the 1800-second per-script deadline, kills the script's
  # process group on timeout and passes the script's native output through.
  run:
    needs: select
    if: needs.select.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        program: ${{ fromJSON(needs.select.outputs.programs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run program
        env:
          PROGRAM: ${{ matrix.program }}
        run: python scripts/verify.py "$(basename -- "$PROGRAM")"
